<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="icon" href="https://image2url.com/r2/default/images/1774579668410-55391703-7184-4252-858c-3690c84902bc.jpeg" type="image/png">
    <link rel="apple-touch-icon" href="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fpng.pngtree.com%2Fpng-vector%2F20220129%2Fourlarge%2Fpngtree-fractured-limb-icon-for-healthcare-and-trauma-treatment-vector-png-image_44257800.jpg&f=1&ipt=cb13b10d918d020004f64cef019b14509eb830a4dc23867784622a4e624572b5">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Muscles</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            /* النمط الفاتح (Sharp Theme) */
            --bg-color: #ffffff;
            --text-color: #000000;
            --table-bg: #ffffff;
            --th-bg: #000000;
            --th-text: #ffffff;
            --border-color: #e0e0e0;
            --border-dark: #000000;
            --cell-focus: #f5f5f5;
            --section-bg: #f0f0f0;
            --btn-hover-bg: #000000;
            --btn-hover-text: #ffffff;
            --danger-color: #d32f2f;
            --danger-hover: #ffffff;
            --action-color: #1976d2;
            --fs-btn-bg: #ffffff;
            --color-btn-bg: #e65100;
        }

        body.dark-mode {
            /* النمط الداكن (Sharp Theme) */
            --bg-color: #000000;
            --text-color: #ffffff;
            --table-bg: #000000;
            --th-bg: #ffffff;
            --th-text: #000000;
            --border-color: #333333;
            --border-dark: #ffffff;
            --cell-focus: #1a1a1a;
            --section-bg: #111111;
            --btn-hover-bg: #ffffff;
            --btn-hover-text: #000000;
            --danger-color: #ff5252;
            --danger-hover: #000000;
            --action-color: #64b5f6;
            --fs-btn-bg: #000000;
            --color-btn-bg: #ffb74d;
        }

        body {
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Cairo', sans-serif;
            margin: 0; 
            padding: 20px; 
            transition: background-color 0.3s, color 0.3s;
            
            /* أنميشن الدخول */
            animation: fadeInPage 0.4s ease-out forwards;
        }

        /* ---------------------------------- */
        /* أنميشن الانتقال بين الصفحات        */
        /* ---------------------------------- */
        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        body.fade-out {
            animation: fadeOutPage 0.3s ease-in forwards !important;
        }

        @keyframes fadeOutPage {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-15px); }
        }

        .main-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-dark); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .main-title { margin: 0; font-size: 2.2em; font-weight: 900; text-align: right; text-transform: uppercase; letter-spacing: 1px; }
        .corner-controls { display: flex; gap: 10px; }
        
        .sub-controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; min-height: 38px; }
        .bottom-controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 25px; padding-top: 20px; border-top: 2px dashed var(--border-dark); }

        .color-toolbar-container {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin 0.4s ease;
        }
        .color-toolbar-container.show {
            max-height: 150px; opacity: 1; margin-bottom: 20px;
        }
        .color-toolbar {
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; padding: 15px; 
            background-color: transparent; border: 1px solid var(--border-dark); border-radius: 0; /* إلغاء الدوران */
        }
        
        .color-input-wrapper { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 300px;}
        #target-word { 
            padding: 8px; border: 1px solid var(--border-dark); border-radius: 0; 
            font-family: 'Cairo', sans-serif; font-size: 15px; width: 100%; 
            background-color: var(--bg-color); color: var(--text-color); 
        }
        
        .btn-apply-color { background-color: var(--color-btn-bg); color: #000; border: 1px solid var(--border-dark); padding: 8px 20px; font-size: 15px; font-weight: bold; border-radius: 0; cursor: pointer; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        .btn-apply-color:hover { background-color: transparent; color: var(--color-btn-bg); border-color: var(--color-btn-bg); }
        
        .btn-clear-colors { background-color: transparent; border: 1px dashed var(--danger-color); color: var(--danger-color); padding: 8px 12px; font-size: 14px; cursor: pointer; font-weight: bold; border-radius: 0; }
        .btn-clear-colors:hover { background-color: var(--danger-color); color: var(--danger-hover); }

        /* الأزرار العامة - حواف حادة */
        .btn { 
            background-color: transparent; border: 1px solid var(--border-dark); color: var(--text-color); 
            padding: 8px 12px; font-family: 'Cairo', sans-serif; font-size: 14px; 
            cursor: pointer; transition: all 0.2s; font-weight: 700; border-radius: 0; 
            text-transform: uppercase;
        }
        .btn:hover { background-color: var(--btn-hover-bg); color: var(--btn-hover-text); border-color: var(--text-color); }
        .back-btn { border-style: dashed; }
        .fs-btn { background-color: var(--fs-btn-bg); }
        .btn-section { border-width: 2px; }
        
        .btn-data { border-color: var(--action-color); color: var(--action-color); }
        .btn-data:hover { background-color: var(--action-color); color: #fff; }
        .btn-clear { border-color: var(--danger-color); color: var(--danger-color); }
        .btn-clear:hover { background-color: var(--danger-color); color: var(--danger-hover); }
        .btn-toggle-colors { border-color: var(--color-btn-bg); color: var(--color-btn-bg); }
        .btn-toggle-colors:hover { background-color: var(--color-btn-bg); color: #000; border-color: var(--border-dark); }
        
        .auto-hide { max-width: 0; padding-left: 0; padding-right: 0; margin: 0; border-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .auto-hide.visible { max-width: 150px; padding-left: 12px; padding-right: 12px; border-width: 1px; opacity: 1; }
        
        .history-btn { color: #8e44ad; border-color: #8e44ad; }
        .history-btn:hover { background-color: #8e44ad; color: #fff; }

        #pdf-content { width: 100%; background-color: var(--bg-color); }

        /* تنسيق الجدول الحاد */
        table { width: 100%; table-layout: fixed; border-collapse: collapse; font-family: 'Cairo', sans-serif; background-color: var(--table-bg); border: 2px solid var(--border-dark); transition: background-color 0.3s; }
        tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        th, td { border: 1px solid var(--border-color); padding: 10px 8px; vertical-align: middle; line-height: 1.4; font-size: 1em; word-wrap: break-word; overflow-wrap: break-word; }
        th { background-color: var(--th-bg); color: var(--th-text); font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-dark); text-align: center; }
        
        .section-header { background-color: var(--section-bg); font-weight: 900; text-align: center; font-size: 1.1em; letter-spacing: 1px; text-transform: uppercase; color: var(--text-color); border-top: 2px solid var(--border-dark); border-bottom: 2px solid var(--border-dark); }
        td[contenteditable="true"] { outline: none; }
        td[contenteditable="true"]:focus { background-color: var(--cell-focus); }
        
        .action-column { text-align: center; vertical-align: middle; user-select: none; }
        .action-btn { background: none; border: 1px solid var(--border-dark); color: var(--text-color); padding: 4px 6px; margin: 2px 1px; font-size: 12px; cursor: pointer; transition: 0.2s; display: inline-block; border-radius: 0; }
        .action-btn:hover { background-color: var(--btn-hover-bg); color: var(--btn-hover-text); }
        .btn-delete-row { border-color: var(--danger-color); color: var(--danger-color); }
        .btn-delete-row:hover { background-color: var(--danger-color); color: var(--danger-hover); }

        .drag-handle { cursor: grab; font-size: 14px; font-weight: bold; padding: 2px 6px; border-style: dashed; touch-action: none;}
        .drag-handle:active { cursor: grabbing; }
        .region-handle { background-color: var(--section-bg); }

        .sortable-ghost { opacity: 0.3; background-color: var(--cell-focus); }
        .sortable-drag { background-color: var(--table-bg) !important; box-shadow: 0 15px 30px rgba(0,0,0,0.4) !important; opacity: 1 !important; cursor: grabbing !important; display: table !important; z-index: 9999 !important; border: 2px solid var(--border-dark) !important; }

        @media screen and (max-width: 768px) {
            body { padding: 15px 5px; } 
            .main-header { flex-direction: column-reverse; align-items: stretch; text-align: center; gap: 15px; }
            .main-title { text-align: center; } 
            .corner-controls { justify-content: center; }
            .corner-controls button { flex: 1; }
            .sub-controls, .bottom-controls { justify-content: center; flex-wrap: wrap; gap: 8px; }
            .sub-controls button { flex: 1 1 45%; font-size: 13px; padding: 8px 4px; }
            .bottom-controls button { flex: 1 1 30%; font-size: 13px; padding: 10px 5px; }
            th, td { padding: 4px 2px; font-size: 12px; line-height: 1.3; }
            th { font-size: 10px; }
            .section-header { font-size: 13px; }
            .action-btn { padding: 2px 4px; font-size: 10px; display: block; width: 100%; box-sizing: border-box; }
            .drag-handle { display: block; width: 100%; margin-bottom: 2px;}
            
            .color-toolbar { flex-direction: column; gap: 10px; padding: 10px; }
            .color-input-wrapper { width: 100%; max-width: none; justify-content: center; }
            #target-word { flex: 1; max-width: 100%; text-align: center; }
            .btn-apply-color, .btn-clear-colors { width: 100%; max-width: none; }
            .color-toolbar-container.show { max-height: 250px; }
        }

        @media print {
            .main-header, .sub-controls, .bottom-controls, .action-column, .color-toolbar-container { display: none !important; }
            table { border: 1px solid #000; font-size: 12pt; }
            th, td { padding: 8px; border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="corner-controls">
            <button class="btn back-btn" onclick="goHome(event)">العودة للرئيسية</button>
            <button class="btn fs-btn" id="fs-btn" onclick="toggleFullScreen()" title="Toggle Full Screen">Full Screen</button>
        </div>
        <h2 class="main-title">Anatomy Muscles</h2>
    </div>

    <div class="sub-controls">
        <button class="btn btn-section" onclick="addSection()">Add Region</button>
        <button class="btn" onclick="addRow()">Add Muscle</button>
        <button class="btn btn-toggle-colors" onclick="toggleColorToolbar()">أدوات التمييز</button>
        <button class="btn auto-hide history-btn" id="undo-btn" onclick="undoData()">&#8617; تراجع</button>
        <button class="btn auto-hide history-btn" id="redo-btn" onclick="redoData()">استعادة &#8618;</button>
        <button class="btn auto-hide btn-clear" id="clear-btn" onclick="clearData()" title="حذف جميع البيانات">Clear Data</button>
    </div>

    <div class="color-toolbar-container" id="color-toolbar">
        <div class="color-toolbar">
            <div class="color-input-wrapper">
                <input type="text" id="target-word" placeholder="اكتب الكلمة هنا... (مثال: crest)">
            </div>
            <button class="btn-apply-color" onclick="applySmartColor()">تمييز</button>
            <button class="btn-clear-colors" onclick="clearAllColors()">إزالة كل الألوان</button>
        </div>
    </div>

    <div id="pdf-content">
        <table id="anatomyTable">
            <thead>
                <tr>
                    <th style="width: 15%;">Muscle</th>
                    <th style="width: 20%;">Origin</th>
                    <th style="width: 20%;">Insertion</th>
                    <th style="width: 20%;">Action</th>
                    <th style="width: 15%;">Nerve supply</th>
                    <th class="action-column" style="width: 10%;">Control</th>
                </tr>
            </thead>
        </table>
    </div>

    <div class="bottom-controls">
        <button class="btn btn-data" onclick="exportPDF()">Export PDF</button>
        <button class="btn btn-data" onclick="exportDataBackup()">Export Backup</button>
        <button class="btn btn-data" onclick="importDataBackup()">Import Backup</button>
    </div>

    <script>
        const table = document.getElementById('anatomyTable');
        let tableSortable;
        let stateHistory = [];
        let historyIndex = -1;
        let isHistoryAction = false; 

        // دالة العودة للرئيسية مع الأنميشن
        function goHome(e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        document.addEventListener('fullscreenchange', () => {
            const fsBtn = document.getElementById('fs-btn');
            fsBtn.innerText = document.fullscreenElement ? "Exit Full Screen" : "Full Screen";
        });

        function loadTheme() {
            if (localStorage.getItem('sharedTheme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector("meta[name=theme-color]").setAttribute("content", "#000000");
            } else {
                document.querySelector("meta[name=theme-color]").setAttribute("content", "#ffffff");
            }
        }

        function migrateOldData() {
            let savedData = localStorage.getItem('lowerLimbAnatomyData');
            if (!savedData) return;
            if (savedData.includes('moveUp') || savedData.includes('moveDown') || savedData.includes('colSpan="6"')) {
                const tempDiv = document.createElement('div'); tempDiv.innerHTML = `<table>${savedData}</table>`;
                const rows = tempDiv.querySelectorAll('tr'); let newHtml = ''; let currentTbodyHtml = '';
                rows.forEach(row => {
                    const sectionHeader = row.querySelector('.section-header');
                    if (sectionHeader) {
                        if (currentTbodyHtml !== '') newHtml += `<tbody>${currentTbodyHtml}</tbody>`;
                        // استبدال الإيموجيات في البيانات القديمة بأكواد
                        currentTbodyHtml = `<tr><td colspan="5" class="section-header" contenteditable="true">${sectionHeader.innerText}</td><td class="action-column"><span class="action-btn drag-handle region-handle" title="Drag entire Region">&#9776;</span><button class="action-btn btn-delete-row" onclick="deleteRegion(this)" title="Delete Region">&#10005;</button></td></tr>`;
                    } else {
                        let cells = row.querySelectorAll('td');
                        if (cells.length >= 5 && !row.querySelector('.section-header')) {
                            let rowHtml = `<tr class="muscle-row">`;
                            for(let i = 0; i < 5; i++) rowHtml += `<td contenteditable="true">${cells[i] ? cells[i].innerHTML : ''}</td>`;
                            rowHtml += `<td class="action-column"><span class="action-btn drag-handle row-handle" title="Drag Muscle">&#9776;</span><button class="action-btn btn-delete-row" onclick="deleteRow(this)" title="Delete Muscle">&#10005;</button></td></tr>`;
                            currentTbodyHtml += rowHtml;
                        }
                    }
                });
                if (currentTbodyHtml !== '') newHtml += `<tbody>${currentTbodyHtml}</tbody>`;
                localStorage.setItem('lowerLimbAnatomyData', newHtml);
            }
        }

        function pushToHistory(htmlData) {
            if (isHistoryAction || (historyIndex >= 0 && stateHistory[historyIndex] === htmlData)) return;
            if (historyIndex < stateHistory.length - 1) stateHistory = stateHistory.slice(0, historyIndex + 1);
            stateHistory.push(htmlData);
            if (stateHistory.length > 30) stateHistory.shift(); else historyIndex++;
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            if (historyIndex > 0) undoBtn.classList.add('visible'); else undoBtn.classList.remove('visible');
            if (historyIndex < stateHistory.length - 1) redoBtn.classList.add('visible'); else redoBtn.classList.remove('visible');
        }

        function undoData() {
            if (historyIndex > 0) {
                isHistoryAction = true; historyIndex--; applyState(stateHistory[historyIndex]);
                isHistoryAction = false; updateHistoryButtons();
            }
        }

        function redoData() {
            if (historyIndex < stateHistory.length - 1) {
                isHistoryAction = true; historyIndex++; applyState(stateHistory[historyIndex]);
                isHistoryAction = false; updateHistoryButtons();
            }
        }

        function applyState(htmlData) {
            document.querySelectorAll('#anatomyTable tbody').forEach(tb => tb.remove());
            if (htmlData && htmlData.trim() !== '') {
                table.insertAdjacentHTML('beforeend', htmlData);
                initSortables();
            }
            localStorage.setItem('lowerLimbAnatomyData', htmlData); 
            updateClearButton();
        }

        function updateClearButton() {
            const clearBtn = document.getElementById('clear-btn');
            const tbodys = document.querySelectorAll('#anatomyTable tbody');
            if (tbodys.length > 0) clearBtn.classList.add('visible');
            else clearBtn.classList.remove('visible');
        }

        function saveData(skipHistory = false) { 
            const tbodys = document.querySelectorAll('#anatomyTable tbody'); let dataToSave = '';
            tbodys.forEach(tb => { 
                Array.from(tb.querySelectorAll('td')).forEach(td => td.style.width = '');
                tb.removeAttribute('data-sortable-init'); dataToSave += tb.outerHTML; 
            });
            localStorage.setItem('lowerLimbAnatomyData', dataToSave); 
            if (!skipHistory) pushToHistory(dataToSave);
            updateClearButton();
        }

        function loadData() {
            const savedData = localStorage.getItem('lowerLimbAnatomyData');
            document.querySelectorAll('#anatomyTable tbody').forEach(tb => tb.remove());

            if (savedData && savedData.trim() !== '') { 
                table.insertAdjacentHTML('beforeend', savedData);
                setTimeout(() => {
                    initSortables();
                    let baseData = ""; 
                    document.querySelectorAll('#anatomyTable tbody').forEach(tb => baseData += tb.outerHTML);
                    pushToHistory(baseData); 
                    updateClearButton();
                }, 50);
            } else {
                pushToHistory(""); 
                updateClearButton();
            }
        }

        function toggleColorToolbar() {
            const toolbar = document.getElementById('color-toolbar');
            toolbar.classList.toggle('show');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function getRandomLightColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 80%, 85%)`;
        }

        function applySmartColor() {
            const wordInput = document.getElementById('target-word');
            const word = wordInput.value.trim();
            
            if(!word) {
                alert("يرجى كتابة الكلمة أو العبارة في المربع أولاً!");
                return;
            }

            const bgColor = getRandomLightColor(); 
            const regex = new RegExp("(?![^<]*>)(" + escapeRegExp(word) + ")", "gi");
            const rows = document.querySelectorAll('#anatomyTable tbody tr.muscle-row');
            
            let matchFound = false;

            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                for(let i=1; i<=4; i++) {
                    if(cells[i] && regex.test(cells[i].innerHTML)) {
                        matchFound = true;
                        cells[i].innerHTML = cells[i].innerHTML.replace(regex, `<span class="smart-hl" style="background-color: ${bgColor}; color: #000; padding: 0 4px; font-weight: bold;">$1</span>`);
                    }
                }
            });
            
            if (matchFound) {
                saveData(false); 
                wordInput.value = ''; 
            } else {
                alert("لم يتم العثور على الكلمة في الجدول! تأكد من الإملاء.");
            }
        }

        function clearAllColors() {
            if(!confirm("هل أنت متأكد من إزالة جميع الألوان من الجدول؟")) return;
            
            const rows = document.querySelectorAll('#anatomyTable tbody tr.muscle-row');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                for(let i=1; i<=4; i++) {
                    if(cells[i]) {
                        cells[i].innerHTML = cells[i].innerHTML.replace(/<span class="smart-hl"[^>]*>(.*?)<\/span>/gi, "$1");
                        cells[i].innerHTML = cells[i].innerHTML.replace(/<span class="smart-hl"[^>]*>(.*?)<\/span>/gi, "$1");
                    }
                }
            });
            saveData(false);
        }

        function fixTableLayout(evt) { Array.from(evt.item.querySelectorAll('td')).forEach(td => td.style.width = window.getComputedStyle(td).width); }
        function resetTableLayout(evt) { Array.from(evt.item.querySelectorAll('td')).forEach(td => td.style.width = ''); saveData(); }

        function initSortables() {
            if(tableSortable) tableSortable.destroy();
            tableSortable = new Sortable(table, { animation: 200, handle: '.region-handle', draggable: 'tbody', forceFallback: true, fallbackClass: 'sortable-drag', ghostClass: 'sortable-ghost', onChoose: fixTableLayout, onEnd: resetTableLayout });
            document.querySelectorAll('#anatomyTable tbody').forEach(tbody => {
                if(!tbody.sortable) {
                    new Sortable(tbody, { group: 'muscles-group', animation: 150, handle: '.row-handle', draggable: '.muscle-row', forceFallback: true, fallbackClass: 'sortable-drag', ghostClass: 'sortable-ghost', onChoose: fixTableLayout, onEnd: resetTableLayout });
                }
            });
        }

        function addSection(defaultText = "Click to edit Region Name", skipSave = false) {
            const newTbody = document.createElement('tbody'); const newRow = document.createElement('tr');
            let cell = document.createElement('td'); cell.colSpan = 5; cell.contentEditable = "true"; cell.className = "section-header"; cell.innerText = defaultText;
            let controlCell = document.createElement('td'); controlCell.className = "action-column";
            // استخدام أكواد HTML بدلا من الإيموجيات
            controlCell.innerHTML = `<span class="action-btn drag-handle region-handle" title="Drag entire Region">&#9776;</span><button class="action-btn btn-delete-row" onclick="deleteRegion(this)" title="Delete Region">&#10005;</button>`;
            newRow.appendChild(cell); newRow.appendChild(controlCell); newTbody.appendChild(newRow); table.appendChild(newTbody);
            initSortables(); if(!skipSave) saveData();
        }

        function addRow(skipSave = false) {
            const tbodys = document.querySelectorAll('#anatomyTable tbody');
            if(tbodys.length === 0) addSection(undefined, true);
            
            const lastTbody = document.querySelectorAll('#anatomyTable tbody')[document.querySelectorAll('#anatomyTable tbody').length - 1];
            const newRow = document.createElement('tr'); newRow.className = "muscle-row";
            for (let i = 0; i < 5; i++) { let cell = document.createElement('td'); cell.contentEditable = "true"; newRow.appendChild(cell); }
            let controlCell = document.createElement('td'); controlCell.className = "action-column";
            // استخدام أكواد HTML بدلا من الإيموجيات
            controlCell.innerHTML = `<span class="action-btn drag-handle row-handle" title="Drag Muscle">&#9776;</span><button class="action-btn btn-delete-row" onclick="deleteRow(this)" title="Delete Muscle">&#10005;</button>`;
            
            newRow.appendChild(controlCell); lastTbody.appendChild(newRow);
            initSortables(); if(!skipSave) saveData();
        }

        function deleteRow(btn) { btn.closest('tr').remove(); saveData(); }
        function deleteRegion(btn) { btn.closest('tbody').remove(); saveData(); }

        function clearData() {
            if(confirm("Are you sure you want to clear all data?")) {
                document.querySelectorAll('#anatomyTable tbody').forEach(tb => tb.remove());
                saveData(); 
            }
        }

        function exportDataBackup() {
            const currentData = localStorage.getItem('lowerLimbAnatomyData') || "";
            const blob = new Blob([currentData], { type: 'text/plain' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'Anatomy_Backup.txt'; link.click();
        }

        function importDataBackup() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = '.txt';
            input.onchange = e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = event => { localStorage.setItem('lowerLimbAnatomyData', event.target.result); migrateOldData(); loadData(); alert("Data imported successfully!"); };
                reader.readAsText(file);
            }; input.click();
        }

        function exportPDF() {
            const element = document.getElementById('pdf-content'); 
            const actionCells = document.querySelectorAll('.action-column');
            actionCells.forEach(cell => cell.style.display = 'none');
            
            const wasDarkMode = document.body.classList.contains('dark-mode'); 
            if (wasDarkMode) document.body.classList.remove('dark-mode');

            const opt = { 
                margin: 10, 
                filename: 'Anatomy_Lower_Limb.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2, useCORS: true }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['css', 'legacy'] } 
            };

            html2pdf().set(opt).from(element).save().then(() => { 
                actionCells.forEach(cell => cell.style.display = ''); 
                if (wasDarkMode) document.body.classList.add('dark-mode'); 
            });
        }

        let typingTimer;
        document.getElementById('anatomyTable').addEventListener('input', () => {
            saveData(true); clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { pushToHistory(localStorage.getItem('lowerLimbAnatomyData')); }, 800); 
        });
        
        window.onload = () => { loadTheme(); migrateOldData(); loadData(); };
    </script>
</body>
</html>

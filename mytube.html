<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTube</title>
    <!-- استدعاء مكتبة أيقونات جوجل الاحترافية المحدثة -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #0f0f0f;
            --surface-color-hover: #272727;
            --pill-bg: rgba(255, 255, 255, 0.1);
            --pill-hover: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --yt-red: #ff0000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* شريط التنقل العلوي المتجاوب بالكامل */
        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 56px;
            background-color: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #272727;
            box-sizing: border-box;
            gap: 12px; /* توزيع مسافات آمن يمنع تداخل العناصر */
        }

        /* عزل الشعار لمنع الانعكاس البرمجي للـ SVG */
        .logo-section {
            direction: ltr !important;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .yt-logo-icon {
            width: 28px;
            height: 20px;
            display: block;
        }

        .logo-text {
            color: #ffffff;
            font-family: "YouTube Sans", "Roboto", "Segoe UI", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        /* تصميم شريط البحث المرن المستقر */
        .search-section {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 550px;
            transition: all 0.2s ease;
        }

        .search-section input {
            width: 100%;
            height: 36px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 0 40px 40px 0; /* متوافق مع اتجاه القراءة العربي */
            padding: 0 16px;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .search-section input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 36px;
            background-color: #222222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 40px 0 0 40px; /* متوافق مع اتجاه القراءة العربي */
            padding: 0 16px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .search-btn:hover {
            background-color: #272727;
        }

        /* قسم أزرار التحكم الجانبية */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
            flex-shrink: 0;
        }
        .profile-section .material-icons-outlined {
            cursor: pointer;
            font-size: 24px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #ff8a80;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #0f0f0f;
        }

        .container {
            margin-top: 56px;
            padding: 16px;
            box-sizing: border-box;
        }

        /* شبكة الفيديوهات للرئيسية */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px 16px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background-color: #222;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .channel-avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .channel-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            max-height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            color: #f1f1f1;
        }

        .video-details p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 18px;
        }
        .channel-link:hover {
            color: white;
        }

        /* صفحة المشغل المتطابقة مع تطبيق يوتيوب */
        .watch-layout {
            display: none;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            max-width: 1280px;
            margin: 0 auto;
        }

        /* 📱 تحسينات الشاشات والهواتف الذكية لمنع الحوسة وإبقاء البحث مستقراً */
        @media (max-width: 600px) {
            .watch-layout { 
                grid-template-columns: 1fr; 
                gap: 16px;
            }
            /* إخفاء الأيقونات الفرعية فقط لتوفير مساحة كاملة ومريحة لشريط البحث */
            .profile-section .material-icons-outlined {
                display: none;
            }
            .search-section {
                max-width: none; /* جعل البحث يأخذ المساحة المتاحة بالتساوي */
            }
            .search-section input {
                font-size: 14px;
                padding: 0 10px;
            }
            .search-btn {
                padding: 0 12px;
            }
        }

        .main-player-col {
            display: flex;
            flex-direction: column;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .watch-title {
            font-size: 18px;
            margin: 12px 0 4px 0;
            font-weight: 700;
            color: #f1f1f1;
            line-height: 26px;
        }

        /* سطر معلومات المشاهدة الفرعي */
        .watch-sub-stats {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* شريط تفاصيل القناة والاشتراك */
        .channel-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 12px 0;
        }

        .channel-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .subscribe-btn {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 0 16px;
            height: 36px;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .subscribe-btn:hover {
            background-color: #d9d9d9;
        }

        /* شريط أزرار التفاعل (مثل، مشاركة، تحميل) بتصميم الكبسولة */
        .actions-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #272727;
        }
        .actions-bar::-webkit-scrollbar { display: none; }

        .action-pill {
            background-color: var(--pill-bg);
            border: none;
            color: white;
            height: 36px;
            padding: 0 14px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-pill:hover { background-color: var(--pill-hover); }

        .like-dislike-group {
            display: flex;
            background-color: var(--pill-bg);
            border-radius: 18px;
            overflow: hidden;
        }
        .like-dislike-group .action-pill {
            background-color: transparent;
            border-radius: 0;
        }
        .like-dislike-group .action-pill:hover {
            background-color: var(--pill-hover);
        }
        .like-sep {
            width: 1px;
            height: 20px;
            background-color: rgba(255,255,255,0.2);
            align-self: center;
        }

        /* صندوق الوصف الذكي المتناسق */
        .description-box {
            background-color: #272727;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 20px;
            margin-bottom: 24px;
        }

        /* قائمة الاقتراحات الجانبية */
        .side-suggestions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .side-card {
            display: flex;
            gap: 8px;
            cursor: pointer;
        }

        .side-thumb {
            width: 140px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: #222;
        }
        .side-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .side-info h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 500; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 18px; }
        .side-info p { margin: 0; font-size: 11px; color: var(--text-secondary); }

        #cleanAudio { display: none; }
    </style>
</head>
<body>

    <!-- الهيدر العلوي المستقر والذكي -->
    <header>
        <div class="logo-section" onclick="clearFilterAndGoHome()">
            <svg class="yt-logo-icon" viewBox="0 0 28 20" preserveAspectRatio="xMidYMid meet">
                <path d="M27.9727 3.12324C27.6435 1.89323 26.6714 0.923232 25.4384 0.594832C23.2054 0 14.2217 0 14.2217 0C14.2217 0 5.23789 0 3.00494 0.594832C1.77199 0.923232 0.800049 1.89323 0.470757 3.12324C0 5.35031 0 10 0 10C0 10 0 14.6497 0.470757 16.8768C0.800049 18.1068 1.77199 19.0768 3.00494 19.4052C5.23789 20 14.2217 20 14.2217 20C14.2217 20 23.2054 20 25.4384 19.4052C26.6714 19.0768 27.6435 18.1068 27.9727 16.8768C28.4435 14.6497 28.4435 10 28.4435 10C28.4435 10 28.4435 5.35031 27.9727 3.12324Z" fill="#FF0000"></path>
                <polygon points="11.4253,14.2854 18.8477,10 11.4253,5.7146" fill="#FFFFFF"></polygon>
            </svg>
            <span class="logo-text">MyTube</span>
        </div>
        
        <!-- شريط البحث الفوري المستمر بالظهور دائماً بشكل متجاوب -->
        <div class="search-section">
            <input type="text" id="searchBox" placeholder="بحث" onkeyup="filterVideos()">
            <button class="search-btn">
                <i class="material-icons-outlined">search</i>
            </button>
        </div>

        <div class="profile-section">
            <i class="material-icons-outlined" onclick="alert('ميزة الرفع ستتوفر قريباً!')">video_call</i>
            <i class="material-icons-outlined">notifications</i>
            <div class="avatar">M</div>
        </div>
    </header>

    <div class="container">
        <!-- قسم تصفح الفيديوهات الرئيسي -->
        <div id="home-view" class="video-grid"></div>

        <!-- صفحة المشغل المطابقة للتطبيق الرسمي -->
        <div id="watch-view" class="watch-layout">
            <div class="main-player-col">
                <div class="player-wrapper">
                    <div id="player"></div>
                </div>
                
                <h2 id="watch-title" class="watch-title">عنوان الفيديو يظهر هنا</h2>
                <div id="watch-sub-stats" class="watch-sub-stats">0 مشاهدة • قبل يومين</div>

                <!-- شريط تفاصيل القناة والاشتراك -->
                <div class="channel-bar">
                    <div class="channel-meta" id="channel-click-zone">
                        <div class="channel-avatar-container" id="watch-channel-avatar">
                            <!-- سيتم حقن الصورة أو الرمز هنا برمجياً -->
                        </div>
                        <div>
                            <div style="font-weight: bold; font-size: 15px;" id="channel-name">اسم القناة</div>
                            <div style="font-size: 12px; color: var(--text-secondary);" id="channel-subs">مشاهدة كل وثائقيات القناة</div>
                        </div>
                    </div>
                    <button class="subscribe-btn">الاشتراك</button>
                </div>

                <!-- شريط أزرار التفاعل الجديد المماثل لليوتيوب الرسمي -->
                <div class="actions-bar">
                    <div class="like-dislike-group">
                        <button class="action-pill" onclick="alert('تم تسجيل الإعجاب')">
                            <i class="material-icons-outlined">thumb_up</i>
                            <span id="watch-likes">4.1ألف</span>
                        </button>
                        <div class="like-sep"></div>
                        <button class="action-pill" onclick="alert('تم تسجيل عدم الإعجاب')">
                            <i class="material-icons-outlined">thumb_down</i>
                        </button>
                    </div>
                    <button class="action-pill" onclick="alert('رابط المشاركة جاهز!')">
                        <i class="material-icons-outlined">share</i>
                        <span>مشاركة</span>
                    </button>
                    <button class="action-pill" onclick="alert('بدء تنزيل النسخة النقلية المحفوظة...')">
                        <i class="material-icons-outlined">file_download</i>
                        <span>تنزيل</span>
                    </button>
                </div>

                <!-- صندوق الوصف الديناميكي -->
                <div class="description-box">
                    <p style="margin: 0; color: #f1f1f1;" id="watch-description">شرح ووصف الفيديو يظهر هنا بشكل ديناميكي وقادم من ملف البيانات الخاص بك...</p>
                </div>
            </div>

            <!-- قائمة الفيديوهات الجانبية المقترحة -->
            <div id="side-suggestions" class="side-suggestions"></div>
        </div>
    </div>

    <audio id="cleanAudio"></audio>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let library = [];
        let player;
        let isApiReady = false;
        const audio = document.getElementById('cleanAudio');
        let syncTimer = null;

        // استدعاء البيانات ديناميكياً
        async function loadDynamicLibrary() {
            try {
                const response = await fetch('videos.json');
                library = await response.json();
                
                buildInterface();
                initPlayerIfReady();
            } catch (error) {
                console.error("خطأ في جلب ملف الكود المخصص، سيتم تشغيل البنية الاحتياطية:", error);
                library = [{ 
                    id: 'hoIUpcCrfu8', 
                    title: 'الوثائقي الأول المذهل - رحلة في أعماق الطبيعة بدون موسيقى', 
                    channel: 'AJ360 - الجزيرة 360', 
                    channel_logo: '',
                    views: '83 ألف مشاهدة', 
                    likes: '4.1 ألف',
                    date: 'قبل سنة واحدة',
                    description: 'تم فصل الموسيقى بالكامل باستخدام تقنيات الذكاء الاصطناعي لتوفير تجربة استماع نقية ومريحة وبدون مؤثرات صوتية موسيقية.',
                    audio: 'https://github.com/aba-njm/abunjm/releases/download/Mp3s/vocals.mp3' 
                }];
                buildInterface();
                initPlayerIfReady();
            }
        }

        // توليد الواجهات البرمجية وتوليد الأفاتار تلقائياً في حال غيابه
        function getAvatarHTML(channelName, logoUrl) {
            if (logoUrl && logoUrl.trim() !== "") {
                return `<img src="${logoUrl}" alt="${channelName}">`;
            } else {
                const firstChar = channelName ? channelName.trim().charAt(0).toUpperCase() : 'Y';
                return `<span style="font-weight:bold; color:#aaa; font-size:18px;">${firstChar}</span>`;
            }
        }

        function buildInterface() {
            const homeView = document.getElementById('home-view');
            homeView.innerHTML = library.map(v => `
                <div class="video-card" onclick="prepareAndPlay('${v.id}')">
                    <div class="thumbnail-container">
                        <img src="https://img.youtube.com/vi/${v.id}/maxresdefault.jpg">
                    </div>
                    <div class="video-info">
                        <div class="channel-avatar-container" onclick="event.stopPropagation(); filterByChannel('${v.channel}')">
                            ${getAvatarHTML(v.channel, v.channel_logo)}
                        </div>
                        <div class="video-details">
                            <h3>${v.title}</h3>
                            <p class="channel-link" onclick="event.stopPropagation(); filterByChannel('${v.channel}')">${v.channel}</p>
                            <p>${v.views || '0 مشاهدة'} • ${v.date || 'قبل فترة'}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            const sideView = document.getElementById('side-suggestions');
            sideView.innerHTML = library.map(v => `
                <div class="side-card" onclick="prepareAndPlay('${v.id}')">
                    <div class="side-thumb">
                        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
                    </div>
                    <div class="side-info">
                        <h4>${v.title}</h4>
                        <p>${v.channel}</p>
                        <p>${v.views || '0 مشاهدة'}</p>
                    </div>
                </div>
            `).join('');
        }

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            initPlayerIfReady();
        }

        function initPlayerIfReady() {
            if (isApiReady && library.length > 0 && !player) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: library[0].id,
                    playerVars: {
                        'controls': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: {
                        'onStateChange': handlePlayerState
                    }
                });
            }
        }

        function prepareAndPlay(videoId) {
            const videoItem = library.find(item => item.id === videoId);
            if (!videoItem) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('watch-view').style.display = 'grid';
            
            document.getElementById('watch-title').innerText = videoItem.title;
            document.getElementById('channel-name').innerText = videoItem.channel;
            document.getElementById('watch-sub-stats').innerText = `${videoItem.views || '0 مشاهدة'} • ${videoItem.date || 'قبل فترة'}`;
            document.getElementById('watch-likes').innerText = videoItem.likes || '0';
            document.getElementById('watch-description').innerText = videoItem.description || 'لا يوجد وصف متاح لهذا الفيديو.';
            
            document.getElementById('watch-channel-avatar').innerHTML = getAvatarHTML(videoItem.channel, videoItem.channel_logo);
            
            document.getElementById('channel-click-zone').onclick = function() {
                filterByChannel(videoItem.channel);
            };

            audio.src = videoItem.audio;
            player.loadVideoById(videoId);
            setTimeout(() => { player.mute(); }, 500);
        }

        function goHome() {
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'grid';
            player.stopVideo();
            audio.pause();
            clearInterval(syncTimer);
        }

        function filterByChannel(channelName) {
            document.getElementById('searchBox').value = channelName;
            goHome();
            filterVideos();
        }

        function clearFilterAndGoHome() {
            document.getElementById('searchBox').value = "";
            goHome();
            filterVideos();
        }

        function handlePlayerState(event) {
            player.mute(); 
            if (event.data == YT.PlayerState.PLAYING) {
                audio.play();
                clearInterval(syncTimer);
                syncTimer = setInterval(() => {
                    player.mute(); 
                    let diff = Math.abs(audio.currentTime - player.getCurrentTime());
                    if (diff > 0.3) {
                        audio.currentTime = player.getCurrentTime();
                    }
                }, 300);
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.BUFFERING) {
                audio.pause();
                clearInterval(syncTimer);
            }
        }

        function filterVideos() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            for (let card of cards) {
                let title = card.querySelector('h3').innerText.toLowerCase();
                let channel = card.querySelector('.channel-link').innerText.toLowerCase();
                if (title.includes(query) || channel.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        loadDynamicLibrary();
    </script>
</body>
</html>

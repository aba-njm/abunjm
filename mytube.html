<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحتوى النقي</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #ff0000; margin-bottom: 20px; }
        .video-container {
            width: 640px;
            height: 360px;
            background: #000;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-text {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>منصة الفيديو النقي 🎧</h1>
    
    <!-- مشغل الفيديو بالطريقة المتوافقة والأمنة -->
    <div class="video-container">
        <!-- استبدل dQw4w9WgXcQ بـ ID أي فيديو تريده (مثلاً مقطع وثائقي أو تعليمي) -->
        <iframe src="https://www.youtube.com/embed/-WMZj_8JF8A?enablejsapi=1&rel=0" allowfullscreen></iframe>
    </div>

    <p class="info-text">ملاحظة: لتجربة فيديو آخر، غير الـ ID في الكود (الحروف بعد embed/).</p>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيديو النقي</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #ff0000; margin-bottom: 20px; }
        .video-container { width: 640px; height: 360px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0px 4px 20px rgba(0,0,0,0.5); }
        #player { width: 100%; height: 100%; }
        .controls { margin-top: 20px; }
        button { background-color: #ff0000; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #cc0000; }
        /* إخفاء مشغل الصوت الافتراضي ليبقى التحكم عبر الزر فقط */
        #cleanAudio { display: none; }
    </style>
</head>
<body>

    <h1>مقطع يوتيوب بالصوت النقي 🎧</h1>
    
    <div class="video-container">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="playBtn">تشغيل المحتوى النقي</button>
    </div>

    <audio id="cleanAudio" src="https://github.com/aba-njm/abunjm/releases/download/Mp3s/vocals.mp3"></audio>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var audio = document.getElementById('cleanAudio');
        var playBtn = document.getElementById('playBtn');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'hoIUpcCrfu8',
                playerVars: { 'controls': 0, 'rel': 0 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            player.mute(); 
        }

        playBtn.addEventListener('click', function() {
            if (player.getPlayerState() == 1) {
                player.pauseVideo();
                audio.pause();
                playBtn.innerText = "تشغيل المحتوى النقي";
            } else {
                player.playVideo();
                audio.play();
                playBtn.innerText = "إيقاف مؤقت";
                
                // مزامنة دقيقة
                var syncInterval = setInterval(function() {
                    if (player.getPlayerState() !== 1) {
                        clearInterval(syncInterval);
                        return;
                    }
                    if (Math.abs(audio.currentTime - player.getCurrentTime()) > 0.3) {
                        audio.currentTime = player.getCurrentTime();
                    }
                }, 500);
            }
        });
    </script>
</body>
</html>

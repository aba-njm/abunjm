<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>mytube</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: Roboto, Arial; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
        #searchBox { padding: 8px; width: 60%; background: #222; border: 1px solid #444; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { cursor: pointer; }
        .card img { width: 100%; border-radius: 12px; }
        #player-view { display: none; padding: 20px; }
    </style>
</head>
<body>

<header id="header">
    <h2>mytube</h2>
    <input type="text" id="searchBox" placeholder="البحث في مكتبتي..." onkeyup="filterVideos()">
</header>

<div id="home-view" class="grid"></div>

<div id="player-view">
    <button onclick="goHome()">⬅️ رجوع</button>
    <div id="player"></div>
    <audio id="cleanAudio"></audio>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // 1. قاعدة بيانات الفيديوهات الخاصة بك
    const videos = [
        { id: 'hoIUpcCrfu8', title: 'الوثائقي الأول', thumb: 'https://img.youtube.com/vi/hoIUpcCrfu8/0.jpg', audio: 'https://github.com/aba-njm/abunjm/releases/download/Mp3s/vocals.mp3' },
        // أضف فيديوهاتك هنا
    ];

    // 2. دوال التنقل
    function renderHome() {
        const grid = document.getElementById('home-view');
        grid.innerHTML = videos.map(v => `
            <div class="card" onclick="openPlayer('${v.id}', '${v.audio}')">
                <img src="${v.thumb}">
                <p>${v.title}</p>
            </div>
        `).join('');
    }

    function openPlayer(vid, audioUrl) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('header').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        
        // تشغيل الفيديو
        player.loadVideoById(vid);
        document.getElementById('cleanAudio').src = audioUrl;
    }

    function goHome() {
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('home-view').style.display = 'grid';
        player.stopVideo();
        document.getElementById('cleanAudio').pause();
    }

    // 3. كود المزامنة المحترف (الاعتماد على أحداث مشغل اليوتيوب)
    let player;
    const audio = document.getElementById('cleanAudio');

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', { height: '360', width: '640', events: { 'onStateChange': onStateChange } });
    }

    function onStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            audio.play();
            // تصحيح فوري عند التشغيل
            audio.currentTime = player.getCurrentTime();
        } else if (event.data == YT.PlayerState.PAUSED) {
            audio.pause();
        } else if (event.data == YT.PlayerState.BUFFERING) {
            audio.pause();
        }
    }

    // تحديث المزامنة فقط عند حدوث تغيير كبير (seek)
    player?.addEventListener('onStateChange', onStateChange);
    
    renderHome();
</script>
</body>
</html>

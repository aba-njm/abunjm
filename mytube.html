<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTube</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #0f0f0f;
            --surface-color-hover: #272727;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --yt-red: #ff0000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* شريط التنقل العلوي الاحترافي */
        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 56px;
            background-color: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #272727;
        }

        /* منطقة الشعار الاحترافي الجديد */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 6px; /* مسافة دقيقة جداً تفصل الأيقونة عن النص مثل الأصل تماماً */
            cursor: pointer;
            user-select: none;
        }

        /* تنسيق أيقونة يوتيوب الرسمية العالية الدقة */
        .yt-logo-icon {
            width: 28px;
            height: 20px;
            display: block;
        }

        /* محاكاة خط يوتيوب الرسمي الحاد والمضغوط */
        .logo-text {
            color: #ffffff;
            font-family: "YouTube Sans", "Roboto", "Segoe UI", "Arial Black", sans-serif;
            font-size: 20px;
            font-weight: 800; /* خط سميك وحاد */
            letter-spacing: -0.8px; /* ضغط الحروف لتعطي نفس مظهر خط يوتيوب المضغوط */
            line-height: 1;
        }

        .search-section {
            display: flex;
            align-items: center;
            width: 40%;
            max-width: 600px;
        }

        .search-section input {
            width: 100%;
            height: 36px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-section input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 38px;
            background-color: #222222;
            border: 1px solid #303030;
            border-right: none;
            border-radius: 0 40px 40px 0;
            padding: 0 20px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover {
            background-color: #272727;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 18px;
            color: white;
        }
        .profile-section .material-icons {
            cursor: pointer;
            font-size: 24px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #ff8a80;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* تصميم الهيكل الرئيسي للشبكة */
        .container {
            margin-top: 76px;
            padding: 20px;
        }

        /* شبكة الفيديوهات الحديثة */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px 16px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background-color: #222;
            transition: border-radius 0.2s;
        }
        .video-card:hover .thumbnail-container {
            border-radius: 4px;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .video-details h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 500;
            line-height: 20px;
            max-height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            color: #f1f1f1;
        }

        .video-details p.channel-name-link {
            margin: 0;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 18px;
            cursor: pointer;
        }
        .video-details p.channel-name-link:hover {
            color: #ffffff;
        }

        .video-details p.video-views-text {
            margin: 0;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 18px;
        }

        /* صفحة المشغل الاحترافية */
        .watch-layout {
            display: none;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            max-width: 1750px;
            margin: 0 auto;
        }

        @media (max-width: 1100px) {
            .watch-layout { grid-template-columns: 1fr; }
        }

        .main-player-col {
            display: flex;
            flex-direction: column;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.7);
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .watch-title {
            font-size: 20px;
            margin: 20px 0 10px 0;
            font-weight: bold;
            color: #f1f1f1;
        }

        /* شريط القناة والتفاعل أسفل المقطع */
        .channel-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #272727;
            margin-bottom: 16px;
        }

        .channel-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clickable-channel {
            cursor: pointer;
        }

        .subscribe-btn {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .subscribe-btn:hover {
            background-color: #d9d9d9;
        }

        .description-box {
            background-color: #272727;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 20px;
        }

        /* قائمة الفيديوهات الجانبية */
        .side-suggestions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .side-card {
            display: flex;
            gap: 8px;
            cursor: pointer;
        }

        .side-thumb {
            width: 168px;
            height: 94px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: #222;
        }
        .side-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .side-info h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 500; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .side-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }

        #cleanAudio { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section" onclick="clearFilterAndGoHome()">
            <svg class="yt-logo-icon" viewBox="0 0 28 20" preserveAspectRatio="xMidYMid meet">
                <path d="M27.9727 3.12324C27.6435 1.89323 26.6714 0.923232 25.4384 0.594832C23.2054 0 14.2217 0 14.2217 0C14.2217 0 5.23789 0 3.00494 0.594832C1.77199 0.923232 0.800049 1.89323 0.470757 3.12324C0 5.35031 0 10 0 10C0 10 0 14.6497 0.470757 16.8768C0.800049 18.1068 1.77199 19.0768 3.00494 19.4052C5.23789 20 14.2217 20 14.2217 20C14.2217 20 23.2054 20 25.4384 19.4052C26.6714 19.0768 27.6435 18.1068 27.9727 16.8768C28.4435 14.6497 28.4435 10 28.4435 10C28.4435 10 28.4435 5.35031 27.9727 3.12324Z" fill="#FF0000"></path>
                <polygon points="11.4253,14.2854 18.8477,10 11.4253,5.7146" fill="#FFFFFF"></polygon>
            </svg>
            <span class="logo-text">MyTube</span>
        </div>
        
        <div class="search-section">
            <input type="text" id="searchBox" placeholder="بحث" onkeyup="filterVideos()">
            <button class="search-btn">
                <i class="material-icons">search</i>
            </button>
        </div>

        <div class="profile-section">
            <i class="material-icons">video_call</i>
            <i class="material-icons">notifications</i>
            <div class="avatar">M</div>
        </div>
    </header>

    <div class="container">
        <div id="home-view" class="video-grid"></div>

        <div id="watch-view" class="watch-layout">
            <div class="main-player-col">
                <div class="player-wrapper">
                    <div id="player"></div>
                </div>
                <h2 id="watch-title" class="watch-title">عنوان الفيديو يظهر هنا</h2>
                <div class="channel-bar">
                    <div class="channel-meta clickable-channel" onclick="filterByChannel(document.getElementById('channel-name').innerText)">
                        <div class="channel-avatar">
                            <i class="material-icons" style="color: #aaa;">account_circle</i>
                        </div>
                        <div>
                            <div style="font-weight: bold;" id="channel-name">منصة النقاء العلمية</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">مشاهدة كل وثائقيات القناة</div>
                        </div>
                        <button class="subscribe-btn" style="margin-right: 15px;">اشتراك</button>
                    </div>
                </div>
                <div class="description-box">
                    <p style="margin: 0; font-weight: bold;" id="watch-views">0 مشاهدة</p>
                    <p style="margin: 8px 0 0 0; color: #ddd;">تم فصل الموسيقى بالكامل باستخدام تقنيات الذكاء الاصطناعي لتوفير تجربة استماع نقية ومريحة وبدون مؤثرات صوتية موسيقية.</p>
                </div>
            </div>

            <div id="side-suggestions" class="side-suggestions"></div>
        </div>
    </div>

    <audio id="cleanAudio"></audio>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let library = [];
        let player;
        let isApiReady = false;
        const audio = document.getElementById('cleanAudio');
        let syncTimer = null;

        // جلب البيانات من ملف JSON
        async function loadDynamicLibrary() {
            try {
                const response = await fetch('videos.json');
                library = await response.json();
                
                buildInterface();
                initPlayerIfReady();
            } catch (error) {
                console.error("خطأ في قراءة ملف videos.json، سيتم استخدام نسخة احتياطية:", error);
                library = [{ 
                    id: 'hoIUpcCrfu8', 
                    title: 'وهم التقدم | استغراب', 
                    channel: 'AJ360 - الجزيرة 360', 
                    views: '150 ألف مشاهدة', 
                    audio: 'https://github.com/aba-njm/abunjm/releases/download/Mp3s/vocals.mp3' 
                }];
                buildInterface();
                initPlayerIfReady();
            }
        }

        // توليد واجهة عرض الفيديوهات
        function buildInterface() {
            const homeView = document.getElementById('home-view');
            homeView.innerHTML = library.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}', '${v.audio}', '${v.title}', '${v.channel}', '${v.views}')">
                    <div class="thumbnail-container">
                        <img src="https://img.youtube.com/vi/${v.id}/maxresdefault.jpg">
                    </div>
                    <div class="video-info">
                        <div class="channel-avatar" onclick="event.stopPropagation(); filterByChannel('${v.channel}')">
                            <i class="material-icons" style="color: #555; font-size: 36px;">account_circle</i>
                        </div>
                        <div class="video-details">
                            <h3>${v.title}</h3>
                            <p class="channel-name-link" onclick="event.stopPropagation(); filterByChannel('${v.channel}')">${v.channel}</p>
                            <p class="video-views-text">${v.views}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            const sideView = document.getElementById('side-suggestions');
            sideView.innerHTML = library.map(v => `
                <div class="side-card" onclick="playVideo('${v.id}', '${v.audio}', '${v.title}', '${v.channel}', '${v.views}')">
                    <div class="side-thumb">
                        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
                    </div>
                    <div class="side-info">
                        <h4>${v.title}</h4>
                        <p>${v.channel}</p>
                        <p>${v.views}</p>
                    </div>
                </div>
            `).join('');
        }

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            initPlayerIfReady();
        }

        function initPlayerIfReady() {
            if (isApiReady && library.length > 0 && !player) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: library[0].id,
                    playerVars: {
                        'controls': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: {
                        'onStateChange': handlePlayerState
                    }
                });
            }
        }

        function playVideo(id, audioFile, title, channel, views) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('watch-view').style.display = 'grid';
            
            document.getElementById('watch-title').innerText = title;
            document.getElementById('channel-name').innerText = channel;
            document.getElementById('watch-views').innerText = views;

            audio.src = audioFile;
            player.loadVideoById(id);
            
            setTimeout(() => { player.mute(); }, 500);
        }

        function goHome() {
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'grid';
            player.stopVideo();
            audio.pause();
            clearInterval(syncTimer);
        }

        // دالة مخصصة لتصفية الفيديوهات حسب اسم صانع المحتوى
        function filterByChannel(channelName) {
            document.getElementById('searchBox').value = channelName;
            goHome();
            filterVideos();
        }

        // دالة مسح الفلاتر والعودة للرئيسية عند الضغط على الشعار الرسمي
        function clearFilterAndGoHome() {
            document.getElementById('searchBox').value = "";
            goHome();
            filterVideos();
        }

        function handlePlayerState(event) {
            player.mute(); 

            if (event.data == YT.PlayerState.PLAYING) {
                audio.play();
                
                clearInterval(syncTimer);
                syncTimer = setInterval(() => {
                    player.mute(); 
                    let diff = Math.abs(audio.currentTime - player.getCurrentTime());
                    if (diff > 0.3) {
                        audio.currentTime = player.getCurrentTime();
                    }
                }, 300);

            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.BUFFERING) {
                audio.pause();
                clearInterval(syncTimer);
            }
        }

        // فحص العناوين وأسماء القنوات معاً أثناء البحث الفوري أو التصفية
        function filterVideos() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            for (let card of cards) {
                let title = card.querySelector('h3').innerText.toLowerCase();
                let channel = card.querySelector('.channel-name-link').innerText.toLowerCase();
                if (title.includes(query) || channel.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        loadDynamicLibrary();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيديو النقي</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #ff0000; margin-bottom: 20px; }
        .video-container {
            width: 640px;
            height: 360px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <h1>مقطع يوتيوب بالصوت النقي 🎧</h1>
    
    <div class="video-container">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="playBtn">تشغيل المحتوى النقي</button>
    </div>

 <audio id="cleanAudio" src="https://github.com/aba-njm/abunjm/releases/download/untagged-7a4c07cf3f45baa9ad36/vocals.1.wav" controls crossorigin="anonymous"></audio>


    <script>
        // تحميل مكتبة اليوتيوب الرسمية
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var audio = document.getElementById('cleanAudio');
        var playBtn = document.getElementById('playBtn');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'hoIUpcCrfu8', // ضع ID الفيديو هنا
                playerVars: {
                    'controls': 0, // إخفاء أزرار اليوتيوب لتجنب تداخل المزامنة
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            player.mute(); // كتم صوت اليوتيوب الأصلي (الذي يحتوي على الموسيقى)
        }

        // التحكم بالتشغيل والمزامنة تلقائياً عند الضغط على الزر
        playBtn.addEventListener('click', function() {
            var state = player.getPlayerState();
            if (state == 1) { // إذا كان الفيديو يعمل، يتم إيقافه هو والصوت
                player.pauseVideo();
                audio.pause();
                playBtn.innerText = "تشغيل المحتوى النقي";
            } else { // إذا كان متوقفاً، يتم تشغيلهما معاً
                player.playVideo();
                audio.play();
                playBtn.innerText = "إيقاف مؤقت";
                
                // التأكد من تطابق وقت الصوت مع وقت الفيديو كل ثانية بدقة
                setInterval(function() {
                    if (Math.abs(audio.currentTime - player.getCurrentTime()) > 0.5) {
                        audio.currentTime = player.getCurrentTime();
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
